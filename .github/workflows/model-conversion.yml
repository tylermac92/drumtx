name: Model conversion

# `drumtx models download` on every OS (M2-5, M2-6): downloads each upstream checkpoint, converts it
# (ADTOF with uv, Open-Unmix in the separation extra), and checks the result against the SHA-256
# pinned in src/drumtx/models.py. Runs when a conversion changes, and on demand. The converted file is not kept (decisions 0001 and 0003).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/drumtx/models.py
      - src/drumtx/convert_adtof.py
      - src/drumtx/separate.py
      - .github/workflows/model-conversion.yml

jobs:
  convert:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DRUMTX_CACHE_DIR: ${{ github.workspace }}/model-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.13 --extra separation
      - run: uv run drumtx models download adtof
      - run: uv run drumtx models download umxl-drums
      - run: uv run drumtx models list
