name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Known vulnerabilities in the locked runtime dependencies, both extras included (M6-3).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >
          uv export --frozen --all-extras --no-dev --no-emit-project --format requirements-txt
          -o "${{ runner.temp }}/requirements.txt"
      - run: uvx pip-audit==2.9.0 -r "${{ runner.temp }}/requirements.txt" --disable-pip --progress-spinner off

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }}
      # FFmpeg on Linux only, so both decode paths (with and without it) are tested.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src tests scripts
      # The MusicXML tests validate against the MusicXML 4.0 XSD, which is not in the repo.
      - run: uv run python scripts/fetch_musicxml_xsd.py "${{ runner.temp }}/musicxml-xsd"
      - run: uv run pytest
        env:
          DRUMTX_MUSICXML_XSD: ${{ runner.temp }}/musicxml-xsd
      - name: Install with pipx and smoke test
        run: |
          pipx install --python python .
          drumtx --version
