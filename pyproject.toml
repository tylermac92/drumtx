[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drumtx"
version = "0.1.0.dev0"
description = "Command-line drum transcription from audio to editable notation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3.3",
    "mir-eval>=0.8",
    "numpy>=2.4.6",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "typer>=0.12",
]

[project.scripts]
drumtx = "drumtx.cli:app"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mypy",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["mido", "jsonschema", "mir_eval", "soundfile", "soxr"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
