[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drumtx"
version = "0.1.0.dev0"
description = "Command-line drum transcription from audio to editable notation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3.3",
    "mir-eval>=0.8",
    "numpy>=2.4.6",
    "onnxruntime>=1.20",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# --separate (M2-6). PyTorch from PyPI is CPU-only on Windows and macOS; for --device cuda, install
# a CUDA build of torch (https://pytorch.org/get-started/locally/).
separation = [
    "openunmix>=1.3,<1.4",
    "safetensors>=0.4",
    "torch>=2.4",
    "torchaudio>=2.4",
]
# --plot (M5-6): a PNG of the events over time, with flagged measures shaded.
plot = ["matplotlib>=3.8"]

[project.scripts]
drumtx = "drumtx.cli:app"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "lxml>=6.1.3",
    "matplotlib>=3.8",  # the plot extra, so its tests run
    "mypy",
    "onnx>=1.23.2",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["mido", "jsonschema", "lxml.*", "mir_eval", "soundfile", "soxr", "onnxruntime", "madmom.*", "tensorflow", "torch", "openunmix.*", "safetensors.*", "beat_this.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = ["real_tracker: use the real beat tracker, not the conftest stand-in"]
